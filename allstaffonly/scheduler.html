<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="../css/back-arrow.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shift Scheduler</title>
    <style>

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }

      th,
      td {
        border: 1px solid #ddd;
        padding: 10px;
        text-align: center;
        font-size: 16px;
      }

      th {
        background-color: #f2f2f2;
        font-weight: bold;
      }

      td {
        background-color: #f9f9f9;
        min-height: 50px;
        cursor: pointer;
      }

      td:hover {
        background-color: #e0e0e0;
      }


      td,
      th {
        height: 50px;
        width: 12.5%;
      }


      td,
      th {
        box-sizing: border-box;
      }


      thead th {
        background-color: #007bff;
        color: white;
      }

      #message {
        font-size: 18px;
        font-weight: bold;
      }


      button {
        margin-top: 20px;
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        cursor: pointer;
        font-size: 16px;
      }

      button:hover {
        background-color: #0056b3;
      }


      header {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        padding: 10px;
        gap: 20px; /
      }

      .back-arrow {
        text-decoration: none;
        font-size: 18px;
        color: #007bff;
      }

      .back-arrow:hover {
        color: #0056b3;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        flex-grow: 1;
        text-align: center;
      }


      @media (max-width: 600px) {
        header {
          flex-direction: column;
          align-items: flex-start;
        }
        h1 {
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="allstaff.html" class="back-arrow"
        >&#9664; Back to All-Staff Home</a
      >
      <h1>Shift Scheduler</h1>
    </header>

    <label for="settings">Settings:</label>
    <select id="settings">
      <option value="0">
        Okay: schedule people for shifts they say they could make, i.e. everyone
        gets a shift they did not mark NOOO for.
      </option>
      <option value="1">
        Great: only schedule if everyone gets a shift they marked as "Great!" or
        "OK"
      </option>
      <option value="2">
        Ideal: only schedule if everyone gets a shift they marked as "Great!"
        (note: this is likely not possible)
      </option>
    </select>

    <p id="message" style="color: red; display: none">
      No schedule could be configured with the chosen settings. Try again with
      looser requirements.
    </p>

    <table>
      <thead>
        <tr>
          <th>Time Slot</th>
          <th>Sunday</th>
          <th>Monday</th>
          <th>Tuesday</th>
          <th>Wednesday</th>
          <th>Thursday</th>
          <th>Friday</th>
          <th>Saturday</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>9am to 12pm</td>
          <td data-shift="0"></td>
          <!-- Sunday -->
          <td data-shift="1"></td>
          <!-- Monday -->
          <td data-shift="2"></td>
          <!-- Tuesday -->
          <td data-shift="3"></td>
          <!-- Wednesday -->
          <td data-shift="4"></td>
          <!-- Thursday -->
          <td data-shift="5"></td>
          <!-- Friday -->
          <td data-shift="6"></td>
          <!-- Saturday -->
        </tr>
        <tr>
          <td>12pm to 3pm</td>
          <td data-shift="7"></td>
          <!-- Sunday -->
          <td data-shift="8"></td>
          <!-- Monday -->
          <td data-shift="9"></td>
          <!-- Tuesday -->
          <td data-shift="10"></td>
          <!-- Wednesday -->
          <td data-shift="11"></td>
          <!-- Thursday -->
          <td data-shift="12"></td>
          <!-- Friday -->
          <td data-shift="13"></td>
          <!-- Saturday -->
        </tr>
        <tr>
          <td>3pm to 6pm</td>
          <td data-shift="14"></td>
          <!-- Sunday -->
          <td data-shift="15"></td>
          <!-- Monday -->
          <td data-shift="16"></td>
          <!-- Tuesday -->
          <td data-shift="17"></td>
          <!-- Wednesday -->
          <td data-shift="18"></td>
          <!-- Thursday -->
          <td data-shift="19"></td>
          <!-- Friday -->
          <td data-shift="20"></td>
          <!-- Saturday -->
        </tr>
        <tr>
          <td>6pm to 9pm</td>
          <td data-shift="21"></td>
          <!-- Sunday -->
          <td data-shift="22"></td>
          <!-- Monday -->
          <td data-shift="23"></td>
          <!-- Tuesday -->
          <td data-shift="24"></td>
          <!-- Wednesday -->
          <td data-shift="25"></td>
          <!-- Thursday -->
          <td data-shift="26"></td>
          <!-- Friday -->
          <td data-shift="27"></td>
          <!-- Saturday -->
        </tr>
        <tr>
          <td>9pm to 12am</td>
          <td data-shift="28"></td>
          <!-- Sunday -->
          <td data-shift="29"></td>
          <!-- Monday -->
          <td data-shift="30"></td>
          <!-- Tuesday -->
          <td data-shift="31"></td>
          <!-- Wednesday -->
          <td data-shift="32"></td>
          <!-- Thursday -->
          <td data-shift="33"></td>
          <!-- Friday -->
          <td data-shift="34"></td>
          <!-- Saturday -->
        </tr>
      </tbody>
    </table>

    <pre id="output"></pre>

    <script src="staffer.js"></script>
    <script src="shift.js"></script>
    <script src="csp.js"></script>
    <button id="scheduleButton">Initialize and Schedule</button>
    <button id="saveButton" style="display: none">Save Schedule</button>

    <script type="module">
      import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

      const supabase = createClient(
        // UPDATE EACH QUARTER
        "https://uwbudrkqyjxcnlpkezdt.supabase.co", 
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3YnVkcmtxeWp4Y25scGtlemR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDM1NjI2MjksImV4cCI6MjA1OTEzODYyOX0.8-3ubutM6TH54iw2UBLRGSbCECZG4dzjoRgarBzLLBw"
      );
      // Fetch responses from Supabase
      async function fetchResponses() {
        try {
          const { data, error } = await supabase
            .from("spr25_responses")
            .select("*");

          if (error) throw error;

          const modifiedResults = data.map((row) => {
            const shiftFields = [
              // Time Slot 1: 9am to 12pm
              "sunday_shift_9_12",
              "monday_shift_9_12",
              "tuesday_shift_9_12",
              "wednesday_shift_9_12",
              "thursday_shift_9_12",
              "friday_shift_9_12",
              "saturday_shift_9_12",

              // Time Slot 2: 12pm to 3pm
              "sunday_shift_12_3",
              "monday_shift_12_3",
              "tuesday_shift_12_3",
              "wednesday_shift_12_3",
              "thursday_shift_12_3",
              "friday_shift_12_3",
              "saturday_shift_12_3",

              // Time Slot 3: 3pm to 6pm
              "sunday_shift_3_6",
              "monday_shift_3_6",
              "tuesday_shift_3_6",
              "wednesday_shift_3_6",
              "thursday_shift_3_6",
              "friday_shift_3_6",
              "saturday_shift_3_6",

              // Time Slot 4: 6pm to 9pm
              "sunday_shift_6_9",
              "monday_shift_6_9",
              "tuesday_shift_6_9",
              "wednesday_shift_6_9",
              "thursday_shift_6_9",
              "friday_shift_6_9",
              "saturday_shift_6_9",

              // Time Slot 5: 9pm to 12am
              "sunday_shift_9_12_pm",
              "monday_shift_9_12_pm",
              "tuesday_shift_9_12_pm",
              "wednesday_shift_9_12_pm",
              "thursday_shift_9_12_pm",
              "friday_shift_9_12_pm",
              "saturday_shift_9_12_pm",
            ];

            const preferences = shiftFields.map(
              (shiftField) => row[shiftField]
            );

            return {
              fullName: `${row.fname} ${row.lname}`,
              preferences,
              doubleStaffedSelection: row.double_shift,
              floater: row.floater,
              email: row.email,
              phone_number: row.phone,
              grad_year: row.grad,
              residence: row.residence,
              additional: row.additional,
              snacks: row.snacks,
              concerns: row.concerns,
              suggestions: row.suggestions,
            };
          });

          return modifiedResults;
        } catch (error) {
          console.error("Error fetching responses:", error);
        }
      }

      document
        .getElementById("saveButton")
        .addEventListener("click", saveSchedule);

      async function saveSchedule() {
        const scheduleData = [];
        const shiftCells = document.querySelectorAll("[data-shift]");

        shiftCells.forEach((cell, index) => {
          console.log(`Updating cell ${index} with data:`, cell.textContent);
          if (cell.textContent) {
            scheduleData.push({
              shift: index,
              staffers: cell.textContent,
            });
          }
        });

        try {
          const { data, error } = await supabase
            .from("spr25_schedule") // was win25_schedule
            .insert([{ schedule: scheduleData }]);

          if (error) throw error;
          alert("Schedule saved successfully!");
        } catch (error) {
          alert("Failed to save the schedule.");
        }
      }

      // Initialize scheduler
      async function initializeAndSchedule() {
        let data = await fetchResponses();
        console.log("Fetched data:", data);

        if (data) {
          let settings = parseInt(document.getElementById("settings").value);
          let staffers = data.map(
            (response) =>
              new Staffer(
                response.fullName,
                response.preferences,
                response.doubleStaffedSelection,
                response.floater,
                response.email,
                response.phone_number,
                response.grad_year,
                response.residence,
                response.additional,
                response.snacks,
                response.concerns,
                response.suggestions
              )
          );

          let shifts = [];
          for (let i = 0; i < 35; i++) {
            shifts.push(new Shift(i));
          }

          let scheduler = new CSP(staffers, shifts, settings);
          let schedule = scheduler.solve();
          console.log(scheduler.bestSolution);
          //
          console.log("Problem Shifts Set:", scheduler.problemShifts);
          let problemShifts = Array.from(scheduler.problemShifts || []); // This will safely convert or fallback to an empty array

          const shiftFields = [
            "Monday 9am to 12pm",
            "Monday 12pm to 3pm",
            "Monday 3pm to 6pm",
            "Monday 6pm to 9pm",
            "Monday 9pm to 12am",
            "Tuesday 9am to 12pm",
            "Tuesday 12pm to 3pm",
            "Tuesday 3pm to 6pm",
            "Tuesday 6pm to 9pm",
            "Tuesday 9pm to 12am",
            "Wednesday 9am to 12pm",
            "Wednesday 12pm to 3pm",
            "Wednesday 3pm to 6pm",
            "Wednesday 6pm to 9pm",
            "Wednesday 9pm to 12am",
            "Thursday 9am to 12pm",
            "Thursday 12pm to 3pm",
            "Thursday 3pm to 6pm",
            "Thursday 6pm to 9pm",
            "Thursday 9pm to 12am",
            "Friday 9am to 12pm",
            "Friday 12pm to 3pm",
            "Friday 3pm to 6pm",
            "Friday 6pm to 9pm",
            "Friday 9pm to 12am",
            "Saturday 9am to 12pm",
            "Saturday 12pm to 3pm",
            "Saturday 3pm to 6pm",
            "Saturday 6pm to 9pm",
            "Saturday 9pm to 12am",
            "Sunday 9am to 12pm",
            "Sunday 12pm to 3pm",
            "Sunday 3pm to 6pm",
            "Sunday 6pm to 9pm",
            "Sunday 9pm to 12am",
          ];

          // Example code to display problem shifts
          if (schedule === null) {
            document.getElementById("message").style.display = "block";
            let problemShiftNames = problemShifts.map(
              (shiftIndex) => shiftFields[shiftIndex]
            );
            let message =
              "No schedule could be configured with the chosen settings. Try again with looser requirements.";
            message += "\nProblem Shifts (with no available staffers):\n";
            if (problemShifts.length > 0) {
              message += problemShiftNames.join(", ") + "\n";
            } else {
              message += "None!\n";
            }
            message += `\nWe need ${
              35 - scheduler.numStaffers
            } more staffers to create a schedule.\n`;

            // Display the message
            document.getElementById("message").textContent = message;
            document.getElementById("message").style.display = "block";
          } else {
            document.getElementById("message").style.display = "none";
            for (let shiftIndex in schedule) {
              let staffers = schedule[shiftIndex];
              let cell = document.querySelector(`[data-shift="${shiftIndex}"]`);
              if (cell) {
                cell.textContent = staffers
                  .map((staffer) => staffer.name)
                  .join(", ");
              }
            }
            document.getElementById("saveButton").style.display = "block";
          }
        }
      }

      document
        .getElementById("scheduleButton")
        .addEventListener("click", initializeAndSchedule);

      // Make shifts editable
      document.querySelectorAll("[data-shift]").forEach((cell) => {
        cell.addEventListener("click", function () {
          const newStaffers = prompt(
            "Enter staff names separated by commas:",
            cell.textContent
          );
          if (newStaffers !== null) {
            cell.textContent = newStaffers.trim();
          }
        });
      });
    </script>
  </body>
</html>
