<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="../css/back-arrow.css" />
    <meta charset="UTF-8" />
    <title>Staff Availability</title>
    <style>
      /* General styles */
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f7f9;
        margin: 0;
        padding: 10px; /* Padding for the body content */
        color: #333;
      }

      /* Styling for the header */
      header {
        display: flex;
        align-items: center;
        justify-content: flex-start; /* Keep it aligned to the left */
        padding: 20px;
        margin-left: -10px; /* Negative margin to pull it back */
        margin-right: -10px; /* Optional: adjust right margin if needed */
        background-color: #007bff;
        color: white;
        gap: 20px; /* Space between back arrow and title */
      }

      .back-arrow {
        text-decoration: none;
        font-size: 18px;
        color: white; /* Updated color to white */
        font-weight: bold;
        transition: color 0.3s;
      }

      .back-arrow:hover {
        color: #cce0ff;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        text-align: center;
        flex-grow: 1; /* Make title take up available space */
      }

      /* Responsive styling for header */
      @media (max-width: 600px) {
        header {
          flex-direction: column;
          align-items: flex-start;
          padding: 15px;
        }
        h1 {
          text-align: left;
          font-size: 20px;
        }
      }

      /* Basic styles for the availability table */
      table {
        width: 100%;
        margin-top: 20px;
        border-collapse: collapse;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Added box-shadow */
        background-color: white; /* Added background-color */
      }

      th,
      td {
        border: 1px solid #ddd;
        padding: 12px;
        text-align: center;
        font-size: 14px; /* Standardized font size */
      }

      th {
        background-color: #007bff;
        color: white; /* Updated header color to match second HTML */
        font-weight: bold;
      }

      td {
        background-color: #f9f9f9;
      }

      td:hover {
        background-color: #e0f0ff; /* Added hover effect for cells */
      }

      .hidden {
        display: none;
      }

      /* Style for additional details */
      .additional-details {
        margin-top: 20px;
        border: 1px solid #ddd;
        padding: 15px; /* Increased padding */
        background-color: #f9f9f9;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Added shadow */
      }

      .additional-details p {
        margin: 8px 0;
        font-size: 14px;
        line-height: 1.5;
      }

      /* Hover effects for staff names */
      h2 {
        font-size: 20px;
        margin-bottom: 10px;
        cursor: pointer;
        color: #007bff;
        transition: color 0.3s;
      }

      h2:hover {
        color: #0056b3;
      }

      /* Responsive styling for mobile devices */
      @media (max-width: 600px) {
        table th,
        table td {
          font-size: 12px;
        }

        h2 {
          font-size: 18px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="allstaff.html" class="back-arrow"
        >&#9664; Back to All-Staff Home</a
      >
      <h1>Staff Availability</h1>
    </header>

    <div id="staffList"></div>

    <script type="module">
      import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

      const supabase = createClient(
        // UPDATE HERE EACH QUARTER
        "https://uwbudrkqyjxcnlpkezdt.supabase.co",
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3YnVkcmtxeWp4Y25scGtlemR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDM1NjI2MjksImV4cCI6MjA1OTEzODYyOX0.8-3ubutM6TH54iw2UBLRGSbCECZG4dzjoRgarBzLLBw"
      );

      async function fetchResponses() {
        try {
          const { data, error } = await supabase
            .from("spr25_responses")
            .select("*");
          if (error) throw error;

          const shiftFields = [
            "monday_shift_9_12",
            "monday_shift_12_3",
            "monday_shift_3_6",
            "monday_shift_6_9",
            "monday_shift_9_12_pm",
            "tuesday_shift_9_12",
            "tuesday_shift_12_3",
            "tuesday_shift_3_6",
            "tuesday_shift_6_9",
            "tuesday_shift_9_12_pm",
            "wednesday_shift_9_12",
            "wednesday_shift_12_3",
            "wednesday_shift_3_6",
            "wednesday_shift_6_9",
            "wednesday_shift_9_12_pm",
            "thursday_shift_9_12",
            "thursday_shift_12_3",
            "thursday_shift_3_6",
            "thursday_shift_6_9",
            "thursday_shift_9_12_pm",
            "friday_shift_9_12",
            "friday_shift_12_3",
            "friday_shift_3_6",
            "friday_shift_6_9",
            "friday_shift_9_12_pm",
            "saturday_shift_9_12",
            "saturday_shift_12_3",
            "saturday_shift_3_6",
            "saturday_shift_6_9",
            "saturday_shift_9_12_pm",
            "sunday_shift_9_12",
            "sunday_shift_12_3",
            "sunday_shift_3_6",
            "sunday_shift_6_9",
            "sunday_shift_9_12_pm",
          ];

          return data.map((row) => {
            const preferences = shiftFields.map(
              (shiftField) => row[shiftField]
            );
            return {
              fullName: `${row.fname} ${row.lname}`,
              preferences,
              doubleStaffedSelection: row.double_shift,
              floater: row.floater,
              email: row.email,
              phone_number: row.phone,
              grad_year: row.grad,
              residence: row.residence,
              additional: row.additional,
              snacks: row.snacks,
              concerns: row.concerns,
              suggestions: row.suggestions,
            };
          });
        } catch (error) {
          console.error(
            "There has been a problem with your fetch operation:",
            error
          );
        }
      }

      function createAvailabilityGrid(preferences) {
        const table = document.createElement("table");
        table.innerHTML = `
     <thead>
       <tr>
         <th>Time Slot</th>
         <th>Sunday</th>
         <th>Monday</th>
         <th>Tuesday</th>
         <th>Wednesday</th>
         <th>Thursday</th>
         <th>Friday</th>
         <th>Saturday</th>
       </tr>
     </thead>
     <tbody>
       <tr>
         <td>9am to 12pm</td>
         <td>${preferences[30]}</td> 
         <td>${preferences[0]}</td>  
         <td>${preferences[5]}</td>  
         <td>${preferences[10]}</td> 
         <td>${preferences[15]}</td> 
         <td>${preferences[20]}</td> 
         <td>${preferences[25]}</td> 
       </tr>
       <tr>
         <td>12pm to 3pm</td>
         <td>${preferences[31]}</td> 
         <td>${preferences[1]}</td>  
         <td>${preferences[6]}</td>  
         <td>${preferences[11]}</td> 
         <td>${preferences[16]}</td> 
         <td>${preferences[21]}</td> 
         <td>${preferences[26]}</td> 
       </tr>
       <tr>
         <td>3pm to 6pm</td>
         <td>${preferences[32]}</td> 
         <td>${preferences[2]}</td>  
         <td>${preferences[7]}</td>  
         <td>${preferences[12]}</td> 
         <td>${preferences[17]}</td> 
         <td>${preferences[22]}</td> 
         <td>${preferences[27]}</td> 
       </tr>
       <tr>
         <td>6pm to 9pm</td>
         <td>${preferences[33]}</td> 
         <td>${preferences[3]}</td>  
         <td>${preferences[8]}</td>  
         <td>${preferences[13]}</td> 
         <td>${preferences[18]}</td> 
         <td>${preferences[23]}</td> 
         <td>${preferences[28]}</td> 
       </tr>
       <tr>
         <td>9pm to 12am</td>
         <td>${preferences[34]}</td> 
         <td>${preferences[4]}</td>  
         <td>${preferences[9]}</td>  
         <td>${preferences[14]}</td> 
         <td>${preferences[19]}</td> 
         <td>${preferences[24]}</td> 
         <td>${preferences[29]}</td> 
       </tr>
     </tbody>
   `;
        return table;
      }

      function createAdditionalDetails(staffer) {
        const detailsDiv = document.createElement("div");
        detailsDiv.classList.add("additional-details");
        detailsDiv.innerHTML = `
       <p><strong>Email:</strong> ${staffer.email}</p>
       <p><strong>Phone Number:</strong> ${staffer.phone_number}</p>
       <p><strong>Grad Year:</strong> ${staffer.grad_year}</p>
       <p><strong>Residence:</strong> ${staffer.residence}</p>
       <p><strong>Double-Staffed Selection:</strong> ${staffer.doubleStaffedSelection}</p>
       <p><strong>Floater or Full-Staff? </strong> ${staffer.floater}</p>
       <p><strong>Additional Info:</strong> ${staffer.additional}</p>
       <p><strong>Snacks:</strong> ${staffer.snacks}</p>
       <p><strong>Concerns:</strong> ${staffer.concerns}</p>
       <p><strong>Suggestions:</strong> ${staffer.suggestions}</p>
     `;
        return detailsDiv;
      }

      async function displayStaffers() {
        const staffListContainer = document.getElementById("staffList");
        const staffers = await fetchResponses();

        let floaterCount = 0;
        let fullStafferCount = 0;

        if (staffers) {
          staffers.forEach((staffer) => {
            const stafferContainer = document.createElement("div");
            const stafferName = document.createElement("h2");
            stafferName.textContent = staffer.fullName;
            stafferContainer.appendChild(stafferName);

            const availabilityGrid = createAvailabilityGrid(
              staffer.preferences
            );
            availabilityGrid.classList.add("hidden");

            const additionalDetails = createAdditionalDetails(staffer);
            additionalDetails.classList.add("hidden");

            stafferContainer.appendChild(availabilityGrid);
            stafferContainer.appendChild(additionalDetails);

            stafferName.addEventListener("click", () => {
              availabilityGrid.classList.toggle("hidden");
              additionalDetails.classList.toggle("hidden");
            });

            staffListContainer.appendChild(stafferContainer);

            if (staffer.floater === "floater") {
              floaterCount++;
            } else {
              fullStafferCount++;
            }
          });

          // Insert floater and full staffer counts at the top
          const countDiv = document.createElement("div");
          countDiv.innerHTML = `
             <p>Floater Count: ${floaterCount}</p>
             <p>Full Staffer Count: ${fullStafferCount}</p>
           `;

          staffListContainer.insertBefore(
            countDiv,
            staffListContainer.firstChild
          );
        }
      }

      displayStaffers();
    </script>
  </body>
</html>
